apply plugin: 'com.android.application'

android {
  compileSdkVersion 26
  buildToolsVersion "26.0.1"
  dexOptions {
    maxProcessCount 2
    javaMaxHeapSize "3g"
  }
  defaultConfig {
    applicationId "com.spiraclestudios.autoskola"
    minSdkVersion 16
    targetSdkVersion 26
    versionCode 12
    versionName "12"

    //renderscriptTargetApi 20
    //renderscriptSupportModeEnabled true

    // Disables generating PNGs at build time and uses real vectors instead.
    vectorDrawables.useSupportLibrary = true

    multiDexEnabled true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  buildTypes {
    release {
      // TODO: Enable minification of release builds.
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  flavorDimensions "price"
  productFlavors {
    //noinspection GroovyMissingReturnStatement
    free {
      applicationId "com.spiraclestudios.autoskola"
      buildConfigField "boolean", "PREMIUM", "false"
    }
    //noinspection GroovyMissingReturnStatement
    premium {
      applicationId "com.spiraclestudios.autoskola.premium"
      buildConfigField "boolean", "PREMIUM", "true"
      /*
      if (BuildConfig.PREMIUM) {
          ...
      }
      */
      //manifestPlaceholders = [someApiKey: "key_here"]
      //use in manifest file like so "${someApiKey}"
    }
  }
  sourceSets {
    main {
      assets.srcDirs = ['src/main/assets', 'src/main/assets/']
      java.srcDirs = ['src/main/java']
    }
    //main.java.srcDirs += 'src/main/kotlin'
    free {
      java.srcDirs = ['src/free/java']
    }
    premium {
      java.srcDirs = ['src/premium/java']
    }
  }
  dataBinding {
    enabled = true
  }
}

repositories {
  maven { url 'https://maven.fabric.io/public' }
  mavenCentral()
  mavenLocal()
}

buildscript {
  //ext.kotlin_version = '1.0.6'
  repositories {
    maven { url 'https://maven.fabric.io/public' }
    jcenter()
    mavenCentral()
  }

  dependencies {
    //noinspection GradleDynamicVersion
    classpath 'io.fabric.tools:gradle:1.+'
    classpath 'com.neenbedankt.gradle.plugins:android-apt:1.8'
    //classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

//apply plugin: 'kotlin-android'
apply plugin: 'io.fabric'

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')

  // Framework
  compile project(path: ":framework-release")
  //debugCompile project(path: deps.framework, configuration: "debug")
  //releaseCompile project(path: deps.framework, configuration: "release")

  //implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Leak Canary
  debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.5.1'
  releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.5.1'

  // Fast Adapter
  implementation('com.mikepenz:fastadapter:2.5.2@aar') { transitive = true; }
  implementation 'com.mikepenz:fastadapter-commons:2.5.2@aar'
  //implementation 'com.mikepenz:fastadapter-extensions:2.5.2@aar'

  // Firebase
  //implementation 'com.google.firebase:firebase-core:10.2.4'
  implementation 'com.google.firebase:firebase-analytics:11.2.2'
  implementation 'com.google.firebase:firebase-ads:11.2.2'
  //implementation "com.google.firebase:firebase-invites:10.2.4"

  // Fabric
  implementation('com.crashlytics.sdk.android:crashlytics:2.6.8@aar') { transitive = true; }
  implementation('com.crashlytics.sdk.android:answers:1.3.13@aar') { transitive = true; }

  // Support Library
  implementation 'com.android.support:support-v4:26.1.0'
  implementation 'com.android.support:appcompat-v7:26.1.0'
  implementation 'com.android.support:support-v13:26.1.0'
  implementation 'com.android.support:design:26.1.0'
  implementation 'com.android.support:recyclerview-v7:26.1.0'
  implementation 'com.android.support:cardview-v7:26.1.0'
  implementation 'com.android.support:gridlayout-v7:26.1.0'

  // Other
  implementation 'com.android.support:multidex:1.0.2'
  implementation 'com.google.guava:guava:19.0'
  implementation 'com.jakewharton:butterknife:8.5.1'
  annotationProcessor 'com.jakewharton:butterknife-compiler:8.5.1'
  implementation 'com.jakewharton.timber:timber:4.5.1'
  implementation 'com.zplesac:connectionbuddy:1.4.0@aar'
  implementation 'com.github.bumptech.glide:glide:3.7.0'
  implementation 'com.facebook.stetho:stetho:1.5.0'
}

apply plugin: 'com.google.gms.google-services'
