apply plugin: 'com.android.application'

android {
  compileSdkVersion 27
  dexOptions {
    maxProcessCount 2
    javaMaxHeapSize "3g"
  }
  defaultConfig {
    applicationId "com.spiraclestudios.autoskola"
    minSdkVersion 16
    targetSdkVersion 27
    versionCode 13
    versionName "13"

    //renderscriptTargetApi 20
    //renderscriptSupportModeEnabled true

    // Disables generating PNGs at build time and uses real vectors instead.
    vectorDrawables.useSupportLibrary = true

    multiDexEnabled true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  buildTypes {
    release {
      // TODO: Enable minification of release builds.
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  flavorDimensions "price"
  productFlavors {
    free {
      applicationId "com.spiraclestudios.autoskola"
      buildConfigField "boolean", "PREMIUM", "false"
    }
    // TODO: Delete after next build
    premium {
      applicationId "com.spiraclestudios.autoskola.premium"
      buildConfigField "boolean", "PREMIUM", "true"
      //manifestPlaceholders = [someApiKey: "key_here"]
      //use in manifest file like so "${someApiKey}"
    }
  }
  sourceSets {
    main {
      assets.srcDirs = ['src/main/assets', 'src/main/assets/']
      java.srcDirs = ['src/main/java']
    }
    main.java.srcDirs += 'src/main/kotlin'
    free {
      java.srcDirs = ['src/free/java']
    }
    premium {
      java.srcDirs = ['src/premium/java']
    }
  }
  dataBinding {
    enabled = true
  }
}

repositories {
  maven { url 'https://maven.fabric.io/public' }
  mavenCentral()
  mavenLocal()
}

buildscript {
  repositories {
    maven { url 'https://maven.fabric.io/public' }
    jcenter()
    mavenCentral()
  }

  dependencies {
    //noinspection GradleDynamicVersion
    classpath 'io.fabric.tools:gradle:1.+'
    classpath 'com.neenbedankt.gradle.plugins:android-apt:1.8'
  }
}

apply plugin: 'kotlin-android'
apply plugin: 'io.fabric'

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')

  // Framework
  implementation project(path: ":framework-release")
  //debugImplementation project(path: deps.framework, configuration: "debug")
  //releaseImplementation project(path: deps.framework, configuration: "release")

  // Kotlin
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jre8:$kotlin_version"

  // Leak Canary
  debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.5.1'
  releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.5.1'

  // Fast Adapter
  implementation('com.mikepenz:fastadapter:2.5.2@aar') { transitive = true }
  implementation 'com.mikepenz:fastadapter-commons:2.5.2@aar'
  //implementation 'com.mikepenz:fastadapter-extensions:2.5.2@aar'

  // Firebase
  //implementation 'com.google.firebase:firebase-core:10.2.4'
  implementation 'com.google.firebase:firebase-analytics:11.4.2'
  implementation 'com.google.firebase:firebase-ads:11.4.2'
  //implementation "com.google.firebase:firebase-invites:10.2.4"

  // Fabric
  implementation('com.crashlytics.sdk.android:crashlytics:2.7.0@aar') { transitive = true }
  implementation('com.crashlytics.sdk.android:answers:1.4.0@aar') { transitive = true }

  // Architecture Components
  // Java8 support for Lifecycles
  implementation "android.arch.lifecycle:common-java8:1.1.0"
  // ViewModel and LiveData
  implementation "android.arch.lifecycle:extensions:1.1.0"
  // ReactiveStreams support for LiveData
  implementation "android.arch.lifecycle:reactivestreams:1.1.0"
  // Test helpers for LiveData
  testImplementation "android.arch.core:core-testing:1.1.0"

  // Support Library
  implementation 'com.android.support:support-v4:27.1.0'
  implementation 'com.android.support:appcompat-v7:27.1.0'
  implementation 'com.android.support:support-v13:27.1.0'
  implementation 'com.android.support:design:27.1.0'
  implementation 'com.android.support:recyclerview-v7:27.1.0'
  implementation 'com.android.support:cardview-v7:27.1.0'
  implementation 'com.android.support:gridlayout-v7:27.1.0'

  // Other
  implementation 'com.android.support:multidex:1.0.2'
  implementation 'com.google.guava:guava:23.0-android'
  implementation 'com.jakewharton:butterknife:8.5.1'
  annotationProcessor 'com.jakewharton:butterknife-compiler:8.5.1'
  implementation 'com.jakewharton.timber:timber:4.5.1'
  implementation 'com.zplesac:connectionbuddy:1.4.0@aar'
  implementation 'com.github.bumptech.glide:glide:3.7.0'
  implementation 'com.facebook.stetho:stetho:1.5.0'
  implementation('com.mikepenz:aboutlibraries:5.9.7@aar') { transitive = true }
  implementation 'org.solovyev.android:checkout:1.2.1'
}

apply plugin: 'com.google.gms.google-services'
